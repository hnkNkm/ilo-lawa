[package]
name = "ilo-lawa"
version = "0.4.0"
edition = "2021"

[dependencies]
uefi = { version = "0.28", default-features = false, features = ["alloc"] }
log = "0.4"
x86_64 = "0.14"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
spin = "0.9"
linked_list_allocator = "0.10"

[features]
# In-kernel test harness (src/test_harness.rs): runs self-tests after init
# and exits QEMU via isa-debug-exit. Off by default; normal builds unchanged.
test-harness = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
